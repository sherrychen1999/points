<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三日中碳接力賽</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--cream:#F5F1E8;--paper:#FBF9F4;--ink:#2B2A24;--mute:#6B6557;--gold:#7A5232;--red:#B9503F;--green:#3F7A4F;--line:#E8E0D0;--sand:#F3EBDD}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
h1{margin:0;font-size:20px;line-height:1.2}
.sub{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:1px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:17px}
.card.red{border-top:6px solid var(--red)}
.card.green{border-top:6px solid var(--green)}
.card.gold{border-top:6px solid var(--gold)}
.muted{color:var(--mute);font-size:14px;margin:0}
.big{font-size:22px;font-weight:800;margin:4px 0 2px}
.code{display:flex;align-items:center;gap:10px;background:#fff;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;margin:10px 0}
.code b{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:2px}
.sent{background:#fff;border:1px dashed var(--gold);border-radius:12px;padding:12px;font-size:15px;margin:10px 0;word-break:break-all}
.btn{display:block;width:100%;border:0;font-family:inherit;-webkit-appearance:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;text-align:center;cursor:pointer;text-decoration:none;margin-top:10px;background:#EEE7D3;color:var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:10px;background:var(--gold);color:#fff}
ol{padding-left:20px;margin:8px 0}
li{margin:4px 0}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.tag{display:inline-block;background:var(--green);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700}
.tag.warn{background:var(--red)}
.loading{text-align:center;padding:60px 0;color:var(--mute)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.flash{background:#FFF4D6;border:1px solid #F0D58A;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin:12px 0 4px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.hero{background:#fff;border:1px solid var(--line);border-top:8px solid var(--red);border-radius:22px;padding:22px 18px 18px;margin-bottom:14px}
.hero h2{margin:0;font-size:30px;line-height:1.3;font-weight:900}
.hero h2 em{font-style:normal;color:var(--red)}
.hero .lead{color:var(--mute);font-size:15px;margin:8px 0 16px}
.video{position:relative;border-radius:18px;overflow:hidden;background:#E9B98F;aspect-ratio:16/9;cursor:pointer}
.video img{width:100%;height:100%;object-fit:cover;display:block}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .badge{position:absolute;left:12px;top:12px;background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:800;line-height:1.4;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.video .play{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(91,64,48,.9);display:flex;align-items:center;justify-content:center}
.video .play:after{content:'';margin-left:5px;border-style:solid;border-width:13px 0 13px 21px;border-color:transparent transparent transparent #fff}
.sec{color:var(--red);font-weight:900;font-size:19px;margin:20px 0 10px}
.gifts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gift{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.gift .pic{background:#fff;border-radius:12px;aspect-ratio:1.1;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gift .pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.gift .pic.ticket{background:#fff}
.tk{position:relative;background:var(--red);color:#fff;border-radius:10px;padding:12px 26px 12px 18px;text-align:center;line-height:1.2}
.tk:before,.tk:after{content:'';position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff}
.tk:before{left:-7px}.tk:after{right:-7px}
.tk small{display:block;font-size:13px;color:#F6D9C9;font-weight:700}
.tk b{font-size:26px;font-weight:900}
.tk i{position:absolute;right:12px;top:8px;bottom:8px;border-right:2px dashed rgba(255,255,255,.7)}
.gift h4{margin:10px 0 0;font-size:15px}
.gift p{margin:2px 0 0;font-size:12px;color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.stat{background:var(--sand);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:900;color:var(--red);line-height:1.2}
.stat span{font-size:13px;font-weight:700}
.btn.cta{background:var(--red);color:#fff;font-size:18px;padding:16px;border-radius:16px;margin-top:14px}
.join{background:var(--sand);border-radius:14px;padding:12px;text-align:center;margin-top:10px;font-size:13px;color:var(--mute)}
.join a{display:inline-block;color:var(--ink);font-weight:900;font-size:15px;text-decoration:none;border-bottom:2px solid var(--red);margin-top:2px}
.small{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
.banner{display:block;background:var(--green);color:#fff;border-radius:14px;padding:13px 14px;text-align:center;font-weight:800;text-decoration:none;margin-bottom:12px;box-shadow:0 3px 0 #2F5C3B}
.banner.red{background:var(--red);box-shadow:0 3px 0 #8E3B2E}
.steps{list-style:none;padding:0;margin:10px 0 4px}
.steps li{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-weight:700;font-size:15px}
.steps .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.steps li.done .n{background:var(--green)}
.meal{position:relative;border-radius:14px;overflow:hidden}
.meal img{width:100%;display:block}
.plate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.plate div{border-radius:12px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mute)}
.plate b{display:block;font-size:14px;color:var(--ink);margin-top:2px}
.combo{background:#FFF6E8;border:1px solid #F0DFC2;border-radius:16px;padding:14px;margin-top:14px}
.combo h3{margin:0;color:var(--gold);font-size:16px}
.combo .pc{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px;margin-top:10px}
.combo .pc img{width:42%;align-self:center;border-radius:10px;object-fit:contain}
.chip{display:inline-block;background:#F2EEE8;border-radius:8px;padding:2px 8px;font-size:12px;margin:3px 3px 0 0}
.price{margin-top:6px}.price .off{background:var(--red);color:#fff;border-radius:8px;padding:1px 6px;font-size:12px;font-weight:800}
.price b{color:var(--red);font-size:20px;margin-left:4px}.price s{color:var(--mute);font-size:12px;margin-left:4px}
.btn.buy{background:var(--ink);color:#fff;margin-top:10px}
.prize{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prize div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:12px;color:var(--mute)}
.prize b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.foot{font-size:12px;color:var(--mute);margin-top:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div class="spin"></div>載入中…</div></div>
<script>
var LIFF_ID = '2007733363-dR34XHdl';
// 正式套 exec（FB社團每日數據）；測試套：AKfycbzIpPQYOzrvtyqQuciYm8xbpcSwHej8YsarVL9QH5b-pDqXalFaevEh9LuXKHsZ_HjZeA
var API = 'https://script.google.com/macros/s/AKfycbymGUr6lgUEQ22SiA291vBEoNM_dVjo6DAF02s3pRBAS4PoNWrZKBJrmbq5kgPc177S2A/exec';
var app = document.getElementById('app');
var STATE = { idt: '' };

// 點擊紀錄：只送步驟、來源和這次開啟的隨機代號，不含任何個資
var SID = (function(){ try { var v = sessionStorage.getItem('relay_sid'); if (!v) { v = Math.random().toString(36).slice(2, 12); sessionStorage.setItem('relay_sid', v); } return v; } catch (e) { return Math.random().toString(36).slice(2, 12); } })();
var SENT = {};
function srcOf(){ var ua = navigator.userAgent || ''; try { if (window.liff && liff.isInClient && liff.isInClient()) return 'line'; } catch (e) {} if (/Instagram/i.test(ua)) return 'ig'; if (/FBAN|FBAV|FB_IAB|FBIOS/i.test(ua)) return 'fb'; if (/ Line\//i.test(ua)) return 'line'; return 'web'; }
function track(step){
  var k = 'relay_t_' + step;
  try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { if (SENT[step]) return; SENT[step] = 1; }
  try { fetch(API + '?api=relay_open&s=' + step + '&src=' + srcOf() + '&vid=' + SID, { mode: 'no-cors' }); } catch (e) {}
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function header(){ return '<header><div class="logo">擇木</div><div><h1>三日中碳接力賽</h1><div class="sub">第二屆 ・ 立即參加</div></div></header>'; }
function msg(title, body, btn){ app.innerHTML = header() + '<section class="card gold"><h2>'+esc(title)+'</h2><p class="muted">'+body+'</p>'+(btn||'')+'</section>'; }

function call(api){
  app.querySelectorAll('.btn').forEach(function(b){ b.style.opacity=.6; b.style.pointerEvents='none'; });
  return fetch(API + '?api=' + api + '&idt=' + encodeURIComponent(STATE.idt) + frParam(), { redirect: 'follow' }).then(function(r){ return r.json(); });
}
function load(api){
  call(api || 'relay').then(function(res){
    if (!res.ok) {
      if (res.err === 'login') {
        var tried = false; try { tried = sessionStorage.getItem('relogin') === '1'; sessionStorage.setItem('relogin','1'); } catch (e) {}
        if (!tried) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
        return msg('登入逾時', '請關閉這個頁面，再從社團活動貼文的連結重新打開。');
      }
      return msg('暫時打不開', '系統忙碌中，請稍後再試一次。', '<button type="button" class="btn primary" onclick="location.reload()">重新整理</button>');
    }
    try { sessionStorage.removeItem('relogin'); } catch (e) {}
    if (api === 'relay_claim' && res.data && res.data.claimed) track('claim');
    render(res.data, res.flash);
  }).catch(function(){
    msg('網路不穩', '連不到系統，請確認網路後再試一次。', '<button type="button" class="btn primary" onclick="location.reload()">重新整理</button>');
  });
}

function copyBtn(id, text, srcId, after){
  var b = document.getElementById(id); if (!b) return;
  b.addEventListener('click', function(ev){
    ev.preventDefault();
    var done = function(){ b.textContent = '已複製'; if (after) after(); setTimeout(function(){ b.textContent = '複製'; }, 1500); };
    var manual = function(){
      b.textContent = '請長按文字複製';
      var src = srcId && document.getElementById(srcId);
      if (src && window.getSelection) { var r = document.createRange(); r.selectNodeContents(src); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      setTimeout(function(){ b.textContent = '複製'; }, 2500);
    };
    var legacy = function(){
      var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.top = '0'; t.style.opacity = '0';
      document.body.appendChild(t); t.focus(); t.select(); t.setSelectionRange(0, text.length);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); ok ? done() : manual();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, legacy); else legacy();
  });
}

// ===== 頁面設定（改這裡就好） =====
var VIDEO_ID = 'WPdjI8ExJQQ';                                   // 蕭醫師前導影片
var GROUP_URL = 'https://www.facebook.com/groups/231085796466032'; // 碳水循環 飲食自由
var STORE_URL = 'https://www.selectgoodfood.com/events/finisher-3d-k7m2q';
var COMBO = { url: '', price: '', orig: '', off: '82 折' };        // 三日挑戰組合：給網址和價格後填入；url 空白時不顯示整張卡
var Q = new URLSearchParams(location.search);
var JOINED = (function(){ try { if (Q.get('joined') === '1' || Q.get('go') === 'claim') localStorage.setItem('relay_joined', '1'); return localStorage.getItem('relay_joined') === '1'; } catch (e) { return Q.get('joined') === '1' || Q.get('go') === 'claim'; } })();
var LOGGED = false, STATS = null;

function baseUrl(){ return location.href.split('?')[0].split('#')[0]; }
function head(sub){ return '<header><div class="logo">擇木</div><div><h1>三日中碳接力賽</h1><div class="sub">第二屆 ・ ' + sub + '</div></div></header>'; }
function playVideo(el){
  if (el.querySelector('iframe')) return;
  track('video');
  el.insertAdjacentHTML('beforeend', '<iframe src="https://www.youtube-nocookie.com/embed/' + VIDEO_ID + '?autoplay=1&playsinline=1&rel=0&modestbranding=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="蕭捷健醫師 三日中碳"></iframe>');
}
function loadStats(cb){
  if (STATS) return cb(STATS);
  fetch(API + '?api=relay_stats', { redirect: 'follow' }).then(function(r){ return r.json(); }).then(function(j){
    var p = j.participation || {}, f = j.funnel || {};
    STATS = { joined: p.participants, finished: f.finished, left: f.left }; cb(STATS);
  }).catch(function(){ cb(null); });
}

// 第二層：立即參加
function renderLanding(){
  var h = head('立即參加')
    + '<section class="hero"><h2>只要三天，<br><em>開啟健康輕盈生活！</em></h2>'
    + '<p class="lead">不用戒澱粉、不用餓肚子，營養師陪你吃對每一餐</p>'
    + '<div class="video" id="vid"><img src="https://i.ytimg.com/vi/' + VIDEO_ID + '/maxresdefault.jpg" onerror="this.onerror=null;this.src=\'https://i.ytimg.com/vi/' + VIDEO_ID + '/hqdefault.jpg\'" alt="蕭捷健醫師影片">'
    + '<div class="badge">蕭捷健醫師<br>邀你一起挑戰三日中碳</div><div class="play"></div></div>'
    + '<div class="sec">完賽好禮</div>'
    + '<div class="gifts"><div class="gift"><div class="pic"><img src="https://cdn-general.cybassets.com/media/W1siZiIsIjI0ODg4L3Byb2R1Y3RzLzU4NjgwNDU1LzE3NzA1NTcyOTVfZDA4NTRiZWRlY2NlOTg5ZWViMjQuanBlZyJdLFsicCIsInRodW1iIiwiMjA0OHgyMDQ4Il1d.jpeg?sha=3a0c8622963b57c3" alt="白巧草莓蛋白棒"></div><h4>白巧草莓蛋白棒</h4><p>1 盒（價值 $480）<br>效期至 2027/1/15</p></div>'
    + '<div class="gift"><div class="pic ticket"><div class="tk"><small>現金券</small><b>$300</b><i></i></div></div><h4>$300 現金券</h4><p>滿 $1,500 可用</p></div></div>'
    + '<div class="stats" id="stats" style="display:none"><div class="stat"><b id="sJoin">–</b><span>人已報名</span></div><div class="stat"><b id="sFin">–</b><span>人已完賽</span></div></div>'
    + '<button type="button" class="btn cta" id="join">我要參加</button>'
    + '<div class="join">還沒加入社團？要先入社才能參加唷<br><a href="' + GROUP_URL + '" target="_blank" rel="noopener">先加入「碳水循環 飲食自由」 ›</a></div>'
    + '<p class="small">完賽禮送完為止</p></section>';
  app.innerHTML = h;
  var v = document.getElementById('vid'); v.addEventListener('click', function(){ playVideo(v); });
  loadStats(function(st){
    if (!st || st.joined == null) return;
    document.getElementById('sJoin').textContent = st.joined;
    document.getElementById('sFin').textContent = st.finished;
    document.getElementById('stats').style.display = '';
  });
  document.getElementById('join').addEventListener('click', function(){
    try { localStorage.setItem('relay_joined', '1'); } catch (e) {}
    JOINED = true; track('join');
    render(LAST && LAST.name !== undefined ? LAST : null, '');
    window.scrollTo(0, 0);
  });
}

// 第三層：報名成功＋3 步驟；第四層：系統確認後按鈕變「領取完賽禮」
function renderMain(d, flash){
  d = d || {};
  var st = d.claimed ? d.status : '';
  var waiting = st === '待留言', checking = st === '核對中', done = !!d.claimed && !waiting && !checking;
  var h = head(done ? '完賽禮領取' : '活動說明');
  if (flash) h += '<div class="flash">' + esc(flash) + '</div>';
  if (done) h += '<a class="banner red" id="bn" href="' + esc(d.barUrl || STORE_URL) + '" target="_blank" rel="noopener">🎉 完賽確認！完賽禮送到了 ›</a>';
  else if (waiting) h += '<a class="banner" href="' + esc(d.postUrl || GROUP_URL) + '" target="_blank" rel="noopener">✍️ 最後一步：到活動貼文留言 ›</a>';
  else if (checking) h += '<div class="banner">⏳ 已收到留言，系統核對中</div>';
  else h += '<a class="banner" href="' + GROUP_URL + '" target="_blank" rel="noopener">🎉 報名成功！今天就發第一篇中碳餐吧 ›</a>';

  var s1 = d.claimed ? ' class="done"' : '', s2 = d.claimed ? ' class="done"' : '', s3 = done ? ' class="done"' : '';
  h += '<section class="hero" style="padding-top:18px"><h2 style="font-size:19px">✅ 參加只要 3 步驟</h2><ol class="steps">'
    + '<li' + s1 + '><span class="n">1</span><span>連續 3 天在社團發中碳餐食照，每篇加上 <b>#中碳日</b></span></li>'
    + '<li' + s2 + '><span class="n">2</span><span>完賽後按下方按鈕，複製完賽留言</span></li>'
    + '<li' + s3 + '><span class="n">3</span><span>留言到活動貼文，並 @ 一位朋友接棒</span></li></ol>';

  if (!d.claimed) {
    h += '<button type="button" class="btn cta" id="claim">我完成三天挑戰，領接力句</button>'
      + '<p class="note" style="font-size:12px">領取即表示同意擇木良食為活動核對與通知，使用你的 LINE 及社團公開資料。</p>';
  } else if (!done) {
    h += '<div class="sent" id="sent">' + esc(d.sentence) + '</div>'
      + '<button type="button" class="btn small" id="cp1">複製完賽留言</button>'
      + '<a class="btn dark" href="' + esc(d.postUrl) + '" target="_blank" rel="noopener">前往活動貼文' + (waiting ? '留言' : '') + '</a>'
      + '<p class="note">' + (waiting ? '把「＿公斤」改成你的數字、@ 一位朋友。末尾的 #' + esc(d.code) + ' 是你的完賽碼，請保留。<br><b>留言後約 5 分鐘</b>，回到這頁就會看到結果（停在這頁會自動更新）。'
        : '系統讀到的發文：' + esc(d.reason || '') + '<br>連續 3 天發文、每篇加 <b>#中碳日</b>，系統每小時重新核對，達成後按鈕會變成「領取完賽禮」，不用再留言。') + '</p>';
  } else {

// 待留言／核對中時，停在頁面上每 30 秒自動檢查一次（最多 30 分鐘）
var POLL = { t: null, n: 0 };
function autoRefresh(on){
  clearTimeout(POLL.t); if (!on || POLL.n >= 60) return;
  POLL.t = setTimeout(function(){
    if (document.hidden) return autoRefresh(true);
    POLL.n++;
    fetch(API + '?api=relay&idt=' + encodeURIComponent(STATE.idt) + frParam(), { redirect: 'follow' }).then(function(r){ return r.json(); }).then(function(res){
      if (!res.ok) return autoRefresh(true);
      var d = res.data;
      if (d.status !== LAST.status || d.reason !== LAST.reason) render(d, d.status === '已領' ? '🎉 確認完賽！完賽禮送到了' : ''); else autoRefresh(true);
    }).catch(function(){ autoRefresh(true); });
  }, 30000);
}

    + '<p class="muted" style="margin-top:14px">按了沒反應？</p>'
    + '<ol><li>按畫面右上角「<b>⋯</b>」</li><li>選「<b>使用外部瀏覽器開啟</b>」，會自動跳到 LINE</li></ol>'
    + '<p class="note">或複製這個連結，貼到 LINE 任一個聊天室點開：</p>'
    + '<div class="code"><b id="lurl" style="font-size:13px;letter-spacing:0;word-break:break-all">' + lineUrl + '</b><button type="button" class="btn small" id="cpl">複製</button></div>'
    + '<button type="button" class="btn" id="weblogin">用 LINE 帳號密碼登入</button>'
    + '</section>';
  copyBtn('cpl', lineUrl, 'lurl');
  track('gate');
  var wk = document.getElementById('wake');
  if (wk) wk.addEventListener('click', function(){ track('wake'); });
  var w = document.getElementById('weblogin');
  if (w) w.addEventListener('click', function(){ liff.login({ redirectUri: baseUrl() + (go ? '?go=' + go : '') }); });
}

function reQuery(){
  // LIFF 會把 ?go=claim 之類的參數放在 liff.state，init 之後才還原到網址
  Q = new URLSearchParams(location.search);
  if (Q.get('go') === 'claim' || Q.get('joined') === '1') { JOINED = true; try { localStorage.setItem('relay_joined', '1'); } catch (e) {} }
}
liff.init({ liffId: LIFF_ID }).then(function(){
  reQuery();
  track('open');
  if (!liff.isLoggedIn()) {
    // 沒登入也能看活動說明；要領接力句時才登入
    if (liff.isInClient()) { liff.login({ redirectUri: location.href }); return; }
    render(null); return;
  }
  STATE.idt = liff.getIDToken();
  if (!STATE.idt) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
  LOGGED = true;
  track('login');
  checkFriend().then(function(){ load(Q.get('go') === 'claim' ? 'relay_claim' : 'relay'); });
}).catch(function(e){
  reQuery();
  track('open');
  render(null);
});
</script>
</body>
</html>
