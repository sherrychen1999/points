<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>三日中碳接力賽 完賽禮</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--cream:#F6F2E6;--paper:#FBF9F2;--ink:#2B2A24;--mute:#6B6557;--gold:#7A5C33;--red:#C8473F;--green:#4F6B3A;--line:#E3DCC8}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
h1{margin:0;font-size:20px;line-height:1.2}
.sub{font-size:12px;color:var(--gold);font-weight:700;letter-spacing:1px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:17px}
.card.red{border-top:6px solid var(--red)}
.card.green{border-top:6px solid var(--green)}
.card.gold{border-top:6px solid var(--gold)}
.muted{color:var(--mute);font-size:14px;margin:0}
.big{font-size:22px;font-weight:800;margin:4px 0 2px}
.code{display:flex;align-items:center;gap:10px;background:#fff;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;margin:10px 0}
.code b{flex:1;font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:2px}
.sent{background:#fff;border:1px dashed var(--gold);border-radius:12px;padding:12px;font-size:15px;margin:10px 0;word-break:break-all}
.btn{display:block;width:100%;border:0;font-family:inherit;-webkit-appearance:none;border-radius:14px;padding:14px;font-size:16px;font-weight:700;text-align:center;cursor:pointer;text-decoration:none;margin-top:10px;background:#EEE7D3;color:var(--ink)}
.btn.primary{background:var(--red);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:10px;background:var(--gold);color:#fff}
ol{padding-left:20px;margin:8px 0}
li{margin:4px 0}
.note{font-size:13px;color:var(--mute);margin-top:8px}
.tag{display:inline-block;background:var(--green);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px;font-weight:700}
.tag.warn{background:var(--red)}
.loading{text-align:center;padding:60px 0;color:var(--mute)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.flash{background:#FFF4D6;border:1px solid #F0D58A;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:700}
.step{display:flex;align-items:center;gap:8px;font-weight:700;margin:12px 0 4px}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center}
.foot{font-size:12px;color:var(--mute);margin-top:20px;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading"><div class="spin"></div>載入中…</div></div>
<script>
var LIFF_ID = '2007733363-dR34XHdl';
// 正式套 exec（FB社團每日數據）；測試套：AKfycbzIpPQYOzrvtyqQuciYm8xbpcSwHej8YsarVL9QH5b-pDqXalFaevEh9LuXKHsZ_HjZeA
var API = 'https://script.google.com/macros/s/AKfycbymGUr6lgUEQ22SiA291vBEoNM_dVjo6DAF02s3pRBAS4PoNWrZKBJrmbq5kgPc177S2A/exec';
var app = document.getElementById('app');
var STATE = { idt: '' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function header(){ return '<header><div class="logo">擇木</div><div><h1>三日中碳接力賽</h1><div class="sub">第二屆 ・ 完賽禮領取</div></div></header>'; }
function msg(title, body, btn){ app.innerHTML = header() + '<section class="card gold"><h2>'+esc(title)+'</h2><p class="muted">'+body+'</p>'+(btn||'')+'</section>'; }

function call(api){
  app.querySelectorAll('.btn').forEach(function(b){ b.style.opacity=.6; b.style.pointerEvents='none'; });
  return fetch(API + '?api=' + api + '&idt=' + encodeURIComponent(STATE.idt) + frParam(), { redirect: 'follow' }).then(function(r){ return r.json(); });
}
function load(api){
  call(api || 'relay').then(function(res){
    if (!res.ok) {
      if (res.err === 'login') {
        var tried = false; try { tried = sessionStorage.getItem('relogin') === '1'; sessionStorage.setItem('relogin','1'); } catch (e) {}
        if (!tried) { liff.logout(); liff.login({ redirectUri: location.href.split('?')[0] }); return; }
        return msg('登入逾時', '請關閉這個頁面，再從社團置頂文的連結重新打開。');
      }
      return msg('暫時打不開', '系統忙碌中，請稍後再試一次。', '<button type="button" class="btn primary" onclick="location.reload()">重新整理</button>');
    }
    try { sessionStorage.removeItem('relogin'); } catch (e) {}
    render(res.data, res.flash);
  }).catch(function(){
    msg('網路不穩', '連不到系統，請確認網路後再試一次。', '<button type="button" class="btn primary" onclick="location.reload()">重新整理</button>');
  });
}

function copyBtn(id, text, srcId, after){
  var b = document.getElementById(id); if (!b) return;
  b.addEventListener('click', function(ev){
    ev.preventDefault();
    var done = function(){ b.textContent = '已複製'; if (after) after(); setTimeout(function(){ b.textContent = '複製'; }, 1500); };
    var manual = function(){
      b.textContent = '請長按文字複製';
      var src = srcId && document.getElementById(srcId);
      if (src && window.getSelection) { var r = document.createRange(); r.selectNodeContents(src); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); }
      setTimeout(function(){ b.textContent = '複製'; }, 2500);
    };
    var legacy = function(){
      var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.top = '0'; t.style.opacity = '0';
      document.body.appendChild(t); t.focus(); t.select(); t.setSelectionRange(0, text.length);
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(t); ok ? done() : manual();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, legacy); else legacy();
  });
}

function render(d, flash){
  LAST = d || {};
  var h = header();
  if (flash) h += '<div class="flash">' + esc(flash) + '</div>';

  if (!d.claimed) {
    h += '<section class="card red"><h2>連續三天中碳、三天發文，完賽禮就是你的</h2>'
      + '<p class="muted">嗨 ' + esc(d.name) + '，完成挑戰了嗎？三步領取：</p>'
      + '<ol><li>11/4 起在「碳水循環 飲食自由」社團連續 3 天發文，每篇都加上 <b>#中碳日</b></li><li>按下方按鈕，拿到你的接力句</li><li>把接力句貼到置頂文留言，系統核對完成後，完賽禮就會出現在這一頁</li></ol>'
      + '<button type="button" class="btn primary" id="claim">我完成三天挑戰，領接力句</button>'
      + '<p class="note" style="font-size:12px">領取即表示同意擇木良食為活動核對與通知，使用你的 LINE 及社團公開資料。</p>'
      + '<p class="note">前 ' + d.max + ' 名，目前還有 ' + d.left + ' 份 ・ 領取至 ' + esc(d.end) + '<br>完賽禮：白巧草莓蛋白棒 1 盒＋NT$300 現金券。系統確認你連續三天發文後才會發出。</p>'
      + '</section>';
    app.innerHTML = h;
    var cb = document.getElementById('claim');
    if (cb) cb.addEventListener('click', function(){ if (d.left <= 0) return; cb.textContent = '領取中…'; load('relay_claim'); });
    return;
  }

  var failed = d.status === '已作廢' || d.status === '逾期' || d.status === '未通過';
  if (failed) {
    h += '<section class="card red"><h2>' + (d.status === '逾期' ? '領取已逾期' : '這次沒有通過核對') + '</h2><p class="muted">'
      + (d.status === '逾期' ? '領取後 7 天內沒有在置頂文留言，這次領取已失效。' : '我們沒有在社團找到你連續三天、帶 #中碳日 的發文紀錄。')
      + (d.reason ? '<br>' + esc(d.reason) : '') + '<br>有疑問請直接在 LINE 留言給小編。</p></section>';
    app.innerHTML = h; return;
  }

  var waiting = d.status === '待留言', checking = d.status === '核對中', done = !waiting && !checking;
  // 接力句
  h += '<section class="card gold"><h2>' + (waiting ? '最後一步：到置頂文留言' : checking ? '已收到留言，核對中' : '你的完賽留言') + '</h2>'
    + (waiting ? '<span class="tag warn">還沒收到你的留言</span>' : checking ? '<span class="tag warn">還沒滿連續 3 天</span>' : '<span class="tag">完賽確認</span>')
    + '<div class="sent" id="sent">' + esc(d.sentence) + '</div>'
    + '<button type="button" class="btn small" id="cp1">複製</button>'
    + (done ? '' : '<a class="btn dark" id="post" href="' + esc(d.postUrl) + '" target="_blank" rel="noopener">前往社團置頂文' + (waiting ? '留言' : '') + '</a>')
    + '<p class="note">' + (waiting ? '把「＿公斤」改成你的數字、@ 一位朋友。末尾的 #' + esc(d.code) + ' 是你的完賽碼，請保留。<br><b>留言後約 5 分鐘</b>，回到這頁就會看到結果（停在這頁會自動更新）。' : '')
    + (checking ? '系統讀到的發文：' + esc(d.reason || '') + '<br>11/4 起連續 3 天發文、每篇加 <b>#中碳日</b>，系統每小時重新核對，達成後這頁就會出現完賽禮，不用再留言。' : '')
    + '</p></section>';

  if (!done) {
    h += '<section class="card red"><h2>完賽禮內容</h2><ul style="padding-left:20px;margin:6px 0;font-size:14px;color:var(--mute)">'
      + '<li>白巧草莓蛋白棒 1 盒（價值 $480，免費；運費 $100，同筆滿 $2,500 免運）</li>'
      + '<li>NT$300 現金券（同一筆訂單滿 $1,500 可用，2027/1/31 前）</li></ul>'
      + '<p class="note">確認完賽後，商店連結和序號會出現在這一頁；有加擇木良食官方 LINE 好友的人也會收到訊息。</p></section>';
  } else {
    h += '<section class="card green"><h2>完賽禮兩步領取</h2>'
      + '<p class="step"><span class="num">1</span>先複製 NT$300 現金券序號</p>'
      + '<div class="code"><b id="c300">' + esc(d.c300) + '</b><button type="button" class="btn small" id="cp3">複製</button></div>'
      + '<p class="note" style="margin-top:0">同一筆訂單滿 $1,500 可用，結帳時貼上。限用一次，2027/1/31 前。</p>'
      + '<p class="step"><span class="num">2</span>到完賽禮商店，領白巧草莓蛋白棒 1 盒（價值 $480，免費）</p>'
      + '<a class="btn primary" id="bar" href="' + esc(d.barUrl || 'https://www.selectgoodfood.com/events/finisher-3d-k7m2q') + '" target="_blank" rel="noopener">前往完賽禮商店</a>'
      + '<p class="note">會用手機瀏覽器打開。蛋白棒加入購物車即可（每單限 1 盒）；運費 $100，同筆滿 $2,500 免運。結帳時在優惠碼欄貼上第 1 步的序號。</p></section>';
  }

  h += '<div id="oa"></div>';
  h += '<div class="foot">領取時間 ' + esc(d.at) + ' ・ 擇木良食 ・ 以上為活動獎勵，不涉及任何療效宣稱</div>';
  app.innerHTML = h;

  copyBtn('cp1', d.sentence, 'sent');
  showOA();
  if (done) {
    copyBtn('cp3', d.c300, 'c300', function(){ var bar = document.getElementById('bar'); if (bar) { bar.textContent = '已複製序號 → 前往完賽禮商店'; bar.scrollIntoView({ behavior: 'smooth', block: 'center' }); } });
    var bar = document.getElementById('bar');
    if (bar) bar.addEventListener('click', function(ev){
      // 用手機預設瀏覽器打開（繞過 LINE 內建瀏覽器，結帳貼序號比較順）
      try { if (window.liff && liff.isInClient && liff.isInClient()) { ev.preventDefault(); liff.openWindow({ url: bar.href, external: true }); } } catch (e) {}
    });
  }
  autoRefresh(!done);
}

// 待留言／核對中時，停在頁面上每 30 秒自動檢查一次（最多 30 分鐘）
var POLL = { t: null, n: 0 };
function autoRefresh(on){
  clearTimeout(POLL.t); if (!on || POLL.n >= 60) return;
  POLL.t = setTimeout(function(){
    if (document.hidden) return autoRefresh(true);
    POLL.n++;
    fetch(API + '?api=relay&idt=' + encodeURIComponent(STATE.idt) + frParam(), { redirect: 'follow' }).then(function(r){ return r.json(); }).then(function(res){
      if (!res.ok) return autoRefresh(true);
      var d = res.data;
      if (d.status !== LAST.status || d.reason !== LAST.reason) render(d, d.status === '已領' ? '🎉 確認完賽！完賽禮送到了' : ''); else autoRefresh(true);
    }).catch(function(){ autoRefresh(true); });
  }, 30000);
}
var LAST = {};

// 還不是官方 LINE 好友才顯示「加入官方 LINE 接收最新消息」
var OA_URL = 'https://lin.ee/V11t7yx', IS_FRIEND = null;
function showOA(){
  var box = document.getElementById('oa'); if (!box) return;
  var paint = function(){
    if (IS_FRIEND) { box.innerHTML = ''; return; }
    box.innerHTML = '<section class="card"><h2>加入官方 LINE 接收最新消息</h2>'
      + '<p class="muted">下一場挑戰、會員活動和限時優惠，第一時間通知你。</p>'
      + '<a class="btn dark" href="' + OA_URL + '" target="_blank" rel="noopener">加入擇木良食官方 LINE</a></section>';
  };
  if (IS_FRIEND !== null) return paint();
  checkFriend().then(paint);
}
function checkFriend(){
  try {
    return liff.getFriendship().then(function(f){ IS_FRIEND = !!(f && f.friendFlag); }, function(){ IS_FRIEND = null; });
  } catch (e) { IS_FRIEND = null; return Promise.resolve(); }
}
function frParam(){ return IS_FRIEND === true ? '&fr=1' : IS_FRIEND === false ? '&fr=0' : ''; }

liff.init({ liffId: LIFF_ID }).then(function(){
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href.split('?')[0] }); return; }
  STATE.idt = liff.getIDToken();
  if (!STATE.idt) { liff.logout(); liff.login({ redirectUri: location.href.split('?')[0] }); return; }
  checkFriend().then(function(){ load('relay'); });
}).catch(function(e){
  msg('打不開', '請從社團置頂文的連結重新打開。（' + esc(e && e.message || e) + '）');
});
</script>
</body>
</html>
