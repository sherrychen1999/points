<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f5f9f8">
<title>集點後台（測試）｜擇木良食</title>
<style>
/* 版面：手機優先單欄；上方固定社團捷徑列，下面兩區待處理清單 */
:root{--ink:#183e40;--muted:#6a8181;--teal:#167e82;--deep:#0f696e;--aqua:#e8f5f2;--line:#dfeae7;--paper:#fff;--bg:#f5f9f8;--amber:#956422;--amber-bg:#fbf4e6;--red:#a3403a;--radius:18px;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.top .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ttl{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--aqua);display:flex;align-items:center;justify-content:center;color:var(--deep);font-weight:700;font-size:11px;flex:none}
.ttl h1{font-size:18px;margin:0;line-height:1.3}
.ttl .sub{font-size:12px;color:var(--muted)}
.ttl .tst{color:var(--amber);font-weight:700}
.ttl .ref{margin-left:auto;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wrap{max-width:640px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;font-family:inherit;min-height:44px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri.sure{background:var(--deep);border-color:var(--deep)}
.btn.go{background:var(--deep);border-color:var(--deep);color:#fff}
.btn.ghost{color:var(--muted)}
.btn.ghost.sure{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.ref:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
h2{font-size:16px;margin:0;display:flex;align-items:center;gap:8px}
h2 .ct{background:var(--teal);color:#fff;border-radius:99px;font-size:12px;padding:0 9px;line-height:22px;font-variant-numeric:tabular-nums}
h2 .ct.zero{background:var(--line);color:var(--muted)}
.sec>.hd{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.sec>.hd>div{flex:1;min-width:0}
.sec>.hd .chev{flex:none;width:30px;height:30px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--deep);font-size:13px;transition:transform .2s}
.sec.shut>.hd .chev{transform:rotate(-90deg)}
.sec.shut>.body{display:none}
.sec>.body{display:flex;flex-direction:column;gap:10px}
.more{align-self:center}
.mini{display:flex;flex-wrap:wrap;gap:6px}
.mini span{font-size:12px;background:var(--paper);border-radius:99px;padding:2px 10px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.sec{display:flex;flex-direction:column;gap:10px}
.item{background:var(--paper);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 2px rgba(24,62,64,.05),0 6px 18px rgba(24,62,64,.05)}
.who{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.who b{font-size:17px}
.pill{font-size:12px;border-radius:99px;padding:1px 9px;font-weight:600;white-space:nowrap}
.pill.first{background:var(--amber-bg);color:var(--amber)}
.pill.ok{background:var(--aqua);color:var(--deep)}
.pill.warn{background:#f9e9e7;color:var(--red)}
.meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.meta span{white-space:nowrap}
.why{font-size:13px;background:var(--bg);border-radius:10px;padding:8px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts.three{grid-template-columns:1fr 1fr 1.3fr}
.bindbox{background:var(--amber-bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.bindbox code{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--deep);letter-spacing:.08em;background:var(--paper);border-radius:6px;padding:0 6px}
.bindbox label{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--ink)}
.bindbox input{font:inherit;font-weight:400;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--paper);color:var(--ink);width:100%;min-width:0}
.empty{background:var(--paper);border-radius:var(--radius);padding:18px 16px;color:var(--muted);font-size:14px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);z-index:9;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.bad{background:var(--red)}
.gate{background:var(--paper);border-radius:var(--radius);padding:18px 16px;display:flex;flex-direction:column;gap:10px}
.gate input{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.foot{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:380px){.acts.three{grid-template-columns:1fr 1fr}.acts.three .pri{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="ttl"><div class="logo">擇木</div><div><h1>集點後台</h1><div class="sub">碳水循環社團 發文集點 <span class="tst">（測試版）</span></div></div><button class="ref" id="ref" type="button">重新整理</button></div>
  <div class="quick"><a class="btn go" id="qGroup" href="#" target="_blank" rel="noopener">開社團</a><a class="btn" id="qBind" href="#" target="_blank" rel="noopener">開置頂綁定文</a></div>
</div></div>
<main class="wrap" id="app"><div class="empty">載入中…</div></main>
<div class="toast" id="toast" hidden></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbzIpPQYOzrvtyqQuciYm8xbpcSwHej8YsarVL9QH5b-pDqXalFaevEh9LuXKHsZ_HjZeA/exec';
var DEMO = /[?&]demo\b/.test(location.search);
var app = document.getElementById('app'), KEY = '', DATA = null;

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k) || ''; if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return ''; } }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function md(d){ return String(d || '').slice(5, 10).replace('-', '/'); }
function toast(t, bad){ var el = document.getElementById('toast'); el.textContent = t; el.className = 'toast' + (bad ? ' bad' : ''); el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function(){ el.hidden = true; }, 4200); }

function call(params){
  if (DEMO) return Promise.resolve(demoCall(params));
  var q = Object.keys(params).map(function(k){ return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(API + '?' + q + '&k=' + encodeURIComponent(KEY) + '&_=' + Date.now(), { redirect: 'follow' }).then(function(r){ return r.json(); });
}

function gate(msg){
  app.innerHTML = '<section class="gate"><h2>輸入後台密碼</h2>'
    + '<p class="hint">' + (msg || '密碼是「集點測試」Apps Script 指令碼屬性裡的 ADMIN_KEY。輸入一次，這支手機會記住。') + '</p>'
    + '<input id="key" type="password" autocomplete="off" placeholder="ADMIN_KEY">'
    + '<button class="btn pri" id="go" type="button">進入後台</button></section>';
  var go = function(){ KEY = document.getElementById('key').value.trim(); if (!KEY) return; store('adminKey', KEY); load(); };
  document.getElementById('go').onclick = go;
  document.getElementById('key').onkeydown = function(e){ if (e.key === 'Enter') go(); };
}

function load(){
  return call({ admin: 'list' }).then(function(res){
    if (!res.ok && res.err === 'key') { store('adminKey', null); return gate('密碼不對，或後台還沒開通（ADMIN_KEY 尚未設定）。'); }
    if (!res.ok) return toast('讀取失敗：' + (res.msg || res.err), true);
    render(res.data);
  }).catch(function(){ app.innerHTML = '<div class="empty">連不到集點系統，請確認網路後按「重新整理」。</div>'; });
}

function claimItem(c){
  var h = '<article class="item" data-kind="claim" data-row="' + c.row + '">';
  h += '<div class="who">' + (c.bound ? '<b>' + esc(c.fbName || '（沒有 FB 名稱）') + '</b>' : '<b>尚未綁定</b>')
    + (c.first ? '<span class="pill first">首次</span>' : '') + (c.already ? '<span class="pill ok">今天已有 1 點</span>' : '') + '</div>';
  h += '<div class="meta"><span>LINE：' + esc(c.lineName || '—') + '</span><span>回報 ' + esc(md(c.date)) + ' ' + esc(String(c.time).slice(11, 16)) + '</span>'
    + (c.bound ? '<span>目前 ' + c.points + ' 點</span>' : '') + '</div>';
  if (c.bound) {
    h += '<div class="acts"><a class="btn" href="' + esc(c.memberUrl) + '" target="_blank" rel="noopener">看他的社團發文</a>'
      + '<button class="btn pri" type="button" data-act="award">立即核發 +1</button></div>';
  } else {
    h += '<div class="bindbox"><div>到置頂綁定文找留言 <code>' + esc(c.code) + '</code>，點留言者的名字，把網址複製貼到下面。</div>'
      + '<label>FB 名稱<input id="nm' + c.row + '" autocomplete="off" placeholder="例如 王小美"></label>'
      + '<label>FB 連結（網址裡有一串數字）<input id="fb' + c.row + '" inputmode="url" autocomplete="off" placeholder="https://www.facebook.com/groups/…/user/1000…/"></label></div>'
      + '<div class="acts"><a class="btn" href="' + esc(DATA.bindUrl) + '" target="_blank" rel="noopener">開綁定文</a>'
      + '<button class="btn pri" type="button" data-act="award">綁定並核發 +1</button></div>';
  }
  return h + '</article>';
}

function postItem(p){
  var h = '<article class="item" data-kind="post" data-row="' + p.row + '">';
  h += '<div class="who"><b>' + esc(p.author) + '</b>' + (p.bound ? '<span class="pill ok">已綁定</span>' : '<span class="pill first">未綁定</span>')
    + (p.suggest && p.suggest !== '計點' ? '<span class="pill warn">' + esc(p.suggest) + '</span>' : '') + '</div>';
  h += '<div class="meta"><span>發文 ' + esc(md(p.date)) + '</span>' + (p.type ? '<span>' + esc(p.type) + '</span>' : '')
    + (p.photo ? '<span>照片：' + esc(p.photo) + '</span>' : '') + '<span>目前 ' + p.points + ' 點</span></div>';
  if (p.reason) h += '<div class="why">系統建議「' + esc(p.suggest || '—') + '」：' + esc(p.reason) + '</div>';
  h += '<div class="acts three"><a class="btn" href="' + esc(p.link || p.memberUrl || DATA.groupUrl) + '" target="_blank" rel="noopener">看貼文</a>'
    + '<button class="btn ghost" type="button" data-act="reject">不計點</button>'
    + '<button class="btn pri" type="button" data-act="award">立即核發 +1</button></div>';
  return h + '</article>';
}

var SHOW = 5, OPEN = { claim: store('shut_claim') !== '1', post: store('shut_post') !== '1' }, MORE = { claim: false, post: false };
function section(kind, title, hint, list, itemFn, emptyText){
  var n = list.length, open = OPEN[kind], shown = MORE[kind] ? list : list.slice(0, SHOW);
  var names = list.slice(0, 6).map(function(x){ return '<span>' + esc(x.fbName || x.author || x.lineName || '—') + '</span>'; }).join('') + (n > 6 ? '<span>…等 ' + n + ' 筆</span>' : '');
  var h = '<section class="sec' + (open ? '' : ' shut') + '" data-sec="' + kind + '">'
    + '<button class="hd" type="button" aria-expanded="' + open + '"><div><h2>' + title + '<span class="ct' + (n ? '' : ' zero') + '">' + n + '</span></h2>'
    + '<p class="hint">' + hint + '</p>' + (!open && n ? '<div class="mini" style="margin-top:6px">' + names + '</div>' : '') + '</div><span class="chev" aria-hidden="true">▾</span></button>'
    + '<div class="body">' + (n ? shown.map(itemFn).join('') : '<div class="empty">' + emptyText + '</div>')
    + (n > SHOW && !MORE[kind] ? '<button class="btn more" type="button" data-more="' + kind + '">再顯示 ' + (n - SHOW) + ' 筆</button>' : '')
    + '</div></section>';
  return h;
}
function render(d){
  DATA = d;
  document.getElementById('qGroup').href = d.groupUrl;
  document.getElementById('qBind').href = d.bindUrl;
  var h = section('claim', '客人回報「我今天發文了」', '到社團確認他今天有本人、公開、有照片的發文，再按核發。', d.claims, claimItem, '目前沒有待確認的回報。');
  h += section('post', '待審貼文', '每天核對社團時抓到、還沒決定的貼文。點標題可以收合。', d.posts, postItem, '目前沒有待審貼文。');
  h += '<p class="foot">更新於 ' + esc(d.at) + '・同一人同一天只算 1 點，和自動核對不會重複給</p>';
  app.innerHTML = h;
}
app.addEventListener('click', function(e){
  var hd = e.target.closest('.sec>.hd');
  if (hd) { var k = hd.parentNode.getAttribute('data-sec'); OPEN[k] = !OPEN[k]; store('shut_' + k, OPEN[k] ? null : '1'); return render(DATA); }
  var mo = e.target.closest('[data-more]');
  if (mo) { MORE[mo.getAttribute('data-more')] = true; return render(DATA); }
});

app.addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]'); if (!b || b.disabled) return;
  var it = b.closest('.item'), kind = it.getAttribute('data-kind'), row = it.getAttribute('data-row'), act = b.getAttribute('data-act');
  var params = { admin: act, kind: kind, row: row };
  if (kind === 'claim' && document.getElementById('fb' + row)) {
    params.fb = document.getElementById('fb' + row).value.trim();
    params.fbName = document.getElementById('nm' + row).value.trim();
    if (!params.fbName || !params.fb) return toast('請先填 FB 名稱和 FB 連結', true);
  }
  if (!b.classList.contains('sure')) {
    var old = b.textContent; b.classList.add('sure'); b.textContent = act === 'reject' ? '確定不計點？' : '再按一次確認';
    setTimeout(function(){ if (b.isConnected && b.classList.contains('sure')) { b.classList.remove('sure'); b.textContent = old; } }, 4000);
    return;
  }
  it.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
  b.textContent = '處理中…';
  call(params).then(function(res){
    if (!res.ok) { toast('沒有完成：' + (res.msg || res.err), true); return load(); }
    var bad = /^(請|這|綁定沒有)/.test(res.msg) && res.msg.indexOf('已核發') < 0;
    toast(res.msg, bad);
    render(res.data);
  }).catch(function(){ toast('連線失敗，請再按一次', true); load(); });
});
document.getElementById('ref').onclick = function(){ if (KEY || DEMO) { app.innerHTML = '<div class="empty">載入中…</div>'; load(); } };

/* ---------- 示範模式（網址加 ?demo，不連系統、資料是假的） ---------- */
var DEMO_DB = {
  groupUrl: 'https://www.facebook.com/groups/2249564272254513',
  bindUrl: 'https://www.facebook.com/groups/2249564272254513/posts/2251352732075667/',
  claims: [
    { row: 3, time: '2026-10-21 13:42', date: '2026-10-21', lineName: '小美🌿', code: 'K7Q2M9', bound: false, fbName: '', fbId: '', points: 0, first: true, already: false, memberUrl: '' },
    { row: 2, time: '2026-10-21 09:15', date: '2026-10-21', lineName: '陳季嫻', code: 'VUU3R4', bound: true, fbName: 'Hsien Chen', fbId: '100000126731937', points: 29, first: false, already: false, memberUrl: 'https://www.facebook.com/groups/2249564272254513/user/100000126731937/' }
  ],
  posts: [
    { row: 9, date: '2026-10-21', author: '邱文亭', fbId: '100006494955336', link: 'https://www.facebook.com/groups/2249564272254513', photo: '是', type: '打卡', suggest: '計點', reason: '本人公開、有照片的午餐打卡', bound: true, points: 1, memberUrl: '' },
    { row: 7, date: '2026-10-21', author: '張○婷', fbId: '61550000000002', link: 'https://www.facebook.com/groups/2249564272254513', photo: '是', type: '心得', suggest: '計點', reason: '本人公開、有照片的一週心得', bound: true, points: 12, memberUrl: '' },
    { row: 6, date: '2026-10-20', author: '黃○華', fbId: '61550000000003', link: 'https://www.facebook.com/groups/2249564272254513', photo: '是', type: '打卡', suggest: '計點', reason: '本人公開、有照片的晚餐打卡', bound: true, points: 5, memberUrl: '' },
    { row: 5, date: '2026-10-20', author: '吳○芳', fbId: '61550000000004', link: 'https://www.facebook.com/groups/2249564272254513', photo: '是', type: '打卡', suggest: '計點', reason: '本人公開、有照片的早餐打卡', bound: false, points: 0, memberUrl: '' },
    { row: 4, date: '2026-10-20', author: '李○慧', fbId: '61550000000005', link: 'https://www.facebook.com/groups/2249564272254513', photo: '否', type: '轉貼', suggest: '不計點', reason: '轉貼文章', bound: true, points: 3, memberUrl: '' },
    { row: 8, date: '2026-10-21', author: '林○如', fbId: '61550000000001', link: 'https://www.facebook.com/groups/2249564272254513', photo: '否', type: '提問', suggest: '不計點', reason: '純提問、沒有照片', bound: false, points: 0, memberUrl: '' }
  ]
};
function demoCall(p){
  var d = DEMO_DB; d.at = new Date().toTimeString().slice(0, 5) + '（示範）';
  if (p.admin === 'list') return { ok: true, data: d };
  var row = Number(p.row), msg;
  if (p.kind === 'claim') {
    var c = d.claims.filter(function(x){ return x.row === row; })[0];
    if (!c.bound && !/\d{5,}/.test(p.fb)) return { ok: true, msg: '請貼上這位客人的 FB 連結（網址裡要有一串數字，例如 …/user/1000…/）', data: d };
    msg = '已核發：' + (c.bound ? c.fbName : p.fbName) + ' ' + c.date + ' +1，目前 ' + (c.points + 1) + ' 點';
    d.claims = d.claims.filter(function(x){ return x.row !== row; });
  } else {
    var q = d.posts.filter(function(x){ return x.row === row; })[0];
    msg = p.admin === 'reject' ? '已標記不計點：' + q.author + ' ' + q.date : '已核發：' + q.author + ' ' + q.date + ' +1，目前 ' + (q.points + 1) + ' 點';
    d.posts = d.posts.filter(function(x){ return x.row !== row; });
  }
  return { ok: true, msg: msg, data: d };
}

if (DEMO) load(); else { KEY = store('adminKey'); if (KEY) load(); else gate(); }
</script>
</body>
</html>
